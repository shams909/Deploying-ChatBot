global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "labai-gateway"
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: "llama-tier1-node01"
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: "llama-tier2-node01"
    static_configs:
      - targets: ["host.docker.internal:8082"]

  - job_name: "llama-tier3-node02"
    static_configs:
      - targets: ["192.168.9.135:8083"]

  - job_name: "node01-system"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "node02-system"
    static_configs:
      - targets: ["192.168.9.135:9100"]
